<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DP 直方图优化可视化工具 (SSE/SAE)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .table-container { max-height: 400px; overflow-y: auto; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: center; }
        th { background-color: #f8fafc; }
        .chart-container { margin-top: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; }
        .tooltip {
            position: absolute;
            text-align: center;
            padding: 6px;
            font: 12px sans-serif;
            background: lightsteelblue;
            border: 0px;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
        }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">
    <div class="container mx-auto bg-white p-6 rounded-lg shadow-xl">
        <h1 class="text-2xl md:text-3xl font-bold text-center text-gray-700 mb-6">DP 直方图优化可视化工具 (SSE/SAE)</h1>
        
        <div class="mb-6 p-4 border border-gray-200 rounded-lg space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="histogramData" class="block text-sm font-medium text-gray-700 mb-1">直方图数据 (逗号分隔):</label>
                    <input type="text" id="histogramData" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500" placeholder="例如: 10,12,15,8,9,11,13" value="10,12,15,8,9,11,13,5,7,14,16,10">
                </div>
                <div>
                    <label for="maxK" class="block text-sm font-medium text-gray-700 mb-1">最大区间数 (max_k):</label>
                    <input type="number" id="maxK" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500" placeholder="例如: 3" value="4">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="errorMetric" class="block text-sm font-medium text-gray-700 mb-1">错误度量:</label>
                    <select id="errorMetric" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="sse" selected>SSE (平方和误差 - 均值)</option>
                        <option value="sae">SAE (绝对值和误差 - 中位数)</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button id="visualizeBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        计算并可视化
                    </button>
                </div>
            </div>
        </div>

        <div id="resultsArea" class="space-y-6">
            <div id="errorCacheSection" class="hidden">
                <h2 id="errorCacheTitle" class="text-xl font-semibold text-gray-700 mb-2">错误缓存</h2>
                <p id="errorCacheDescription" class="text-sm text-gray-600 mb-2"></p>
                <div id="errorCacheTableContainer" class="table-container rounded-md border border-gray-300"></div>
            </div>

            <div id="dpTableSection" class="hidden">
                <h2 id="dpTableTitle" class="text-xl font-semibold text-gray-700 mb-2">DP 表</h2>
                <p id="dpTableDescription" class="text-sm text-gray-600 mb-2"></p>
                <div id="dpTableContainer" class="table-container rounded-md border border-gray-300"></div>
            </div>

            <div id="ptrTableSection" class="hidden">
                <h2 id="ptrTableTitle" class="text-xl font-semibold text-gray-700 mb-2">指针表</h2>
                <p id="ptrTableDescription" class="text-sm text-gray-600 mb-2"></p>
                <div id="ptrTableContainer" class="table-container rounded-md border border-gray-300"></div>
            </div>
            
            <div id="reconstructionSection" class="hidden p-4 border border-gray-200 rounded-lg">
                <h2 class="text-xl font-semibold text-gray-700 mb-2">边界重构与直方图</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="finalK" class="block text-sm font-medium text-gray-700 mb-1">选择最终区间数 (k):</label>
                        <select id="finalK" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"></select>
                    </div>
                    <div class="flex items-end">
                         <button id="reconstructBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                            重构并显示直方图
                        </button>
                    </div>
                </div>
                <div id="reconstructedBoundaries" class="mt-4 text-sm text-gray-600"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div id="originalHistogramContainer" class="chart-container hidden">
                    <h3 class="text-lg font-semibold text-gray-700 mb-2 text-center">原始直方图</h3>
                    <svg id="originalHistogramChart" class="w-full h-64 md:h-80"></svg>
                </div>
                <div id="optimizedHistogramContainer" class="chart-container hidden">
                    <h3 id="optimizedHistogramTitle" class="text-lg font-semibold text-gray-700 mb-2 text-center">优化后的直方图</h3>
                    <svg id="optimizedHistogramChart" class="w-full h-64 md:h-80"></svg>
                </div>
            </div>
        </div>
        <div id="errorMessage" class="mt-4 text-red-600"></div>
    </div>
    <div class="tooltip"></div>

    <script>
        // --- 辅助错误计算函数 ---
        function calculateSSEMeanRepr(arr) {
            // Calculates Sum of Squared Errors using mean as representative
            if (!arr || arr.length === 0) {
                return 0;
            }
            const mean = arr.reduce((sum, val) => sum + val, 0) / arr.length;
            return arr.reduce((sum, val) => sum + Math.pow(val - mean, 2), 0);
        }

        function calculateSAEMedianRepr(arr) {
            // Calculates Sum of Absolute Errors using median as representative
            if (!arr || arr.length === 0) {
                return 0;
            }
            const sortedArr = [...arr].sort((a, b) => a - b);
            let median;
            const mid = Math.floor(sortedArr.length / 2);
            if (sortedArr.length % 2 === 0) {
                median = (sortedArr[mid - 1] + sortedArr[mid]) / 2;
            } else {
                median = sortedArr[mid];
            }
            return arr.reduce((sum, val) => sum + Math.abs(val - median), 0);
        }

        // --- DP 核心逻辑 ---
        function findOptimalHistogramDp(histogramData, maxK, errorMetric = 'sse') {
            const n = histogramData.length;
            if (n === 0) { // 如果没有数据, 则返回空表
                const emptyDPTable = Array(1).fill(null).map(() => Array(maxK + 1).fill(Infinity));
                if (maxK >=0) emptyDPTable[0][0] = 0;
                const emptyPtrTable = Array(1).fill(null).map(() => Array(maxK + 1).fill(0));
                return { dpTable: emptyDPTable, ptrTable: emptyPtrTable, errorCache: [] };
            }

            // 1. 计算错误缓存 (Error Cache)
            const errorCache = Array(n).fill(null).map(() => Array(n).fill(Infinity));
            const errorFunc = errorMetric === 'sae' ? calculateSAEMedianRepr : calculateSSEMeanRepr;

            for (let i = 0; i < n; i++) {
                for (let j = i; j < n; j++) {
                    const subArray = histogramData.slice(i, j + 1);
                    errorCache[i][j] = errorFunc(subArray);
                }
            }

            // 2. DP 计算
            // kVal 是实际用于 DP 表的区间数上限, 不超过数据点数 n 或用户指定的 maxK
            const kVal = Math.min(maxK, n); 
            const dpTable = Array(n + 1).fill(null).map(() => Array(kVal + 1).fill(Infinity));
            const ptrTable = Array(n + 1).fill(null).map(() => Array(kVal + 1).fill(0));

            dpTable[0][0] = 0; // 0个数据点分为0个区间的误差为0

            for (let jBins = 1; jBins <= kVal; jBins++) { // 目标区间数量
                for (let iDataEndIdx = 1; iDataEndIdx <= n; iDataEndIdx++) { // 考虑的数据点数量 (前 iDataEndIdx 个点, 即 histogramData[0...iDataEndIdx-1])
                    let minErrorForIJ = Infinity;
                    let bestLForIJ = -1; // 记录最后一个区间的起始点
                    
                    // 最后一个区间的起始索引 lLastBinStartIdx (0-based)
                    // 最后一个区间的数据是 histogramData[lLastBinStartIdx ... iDataEndIdx-1]
                    // 这个区间至少有1个元素, 所以 lLastBinStartIdx <= iDataEndIdx-1
                    // 前面 jBins-1 个区间处理了数据 histogramData[0 ... lLastBinStartIdx-1]
                    // 这要求 lLastBinStartIdx >= jBins-1 (因为jBins-1个区间至少需要jBins-1个数据点)
                    for (let lLastBinStartIdx = Math.max(0, jBins - 1); lLastBinStartIdx < iDataEndIdx; lLastBinStartIdx++) {
                        // 最后一个区间的误差 (数据从索引 lLastBinStartIdx 到 iDataEndIdx-1)
                        const lastBinError = errorCache[lLastBinStartIdx][iDataEndIdx - 1];
                        
                        if (dpTable[lLastBinStartIdx][jBins - 1] !== Infinity) { // 如果前一部分有有效解
                            const currentTotalError = dpTable[lLastBinStartIdx][jBins - 1] + lastBinError;
                            if (currentTotalError < minErrorForIJ) {
                                minErrorForIJ = currentTotalError;
                                bestLForIJ = lLastBinStartIdx; // 记录这个分割点
                            }
                        }
                    }
                    if (bestLForIJ !== -1) { // 只有找到有效分割才更新
                        dpTable[iDataEndIdx][jBins] = minErrorForIJ;
                        ptrTable[iDataEndIdx][jBins] = bestLForIJ;
                    }
                }
            }
            return { dpTable, ptrTable, errorCache };
        }

        // --- 重建边界 ---
        /**
         * 根据指针表 (ptrTable) 和指定的区间数量 (k) 来重建最优的直方图边界. 
         * 这个函数通过回溯 ptrTable 来找到分割点. 
         * ptrTable[i][j] 存储的是：当将前 i 个数据点（索引0到i-1）分割成 j 个区间时, 
         * 第 j 个（即最后一个）区间的起始数据点索引（0-based）. 
         *
         * @param {number[][]} ptrTable - 指针表. 
         * @param {number} n - 原始数据点的总数. 
         * @param {number} k - 期望重建的区间数量. 
         * @returns {number[]} 一个数组, 包含 k 个区间的结束点（exclusive end index）. 
         * 例如, 如果k=3, 数据长度n, 返回 [b1, b2, n], 
         * 则区间为 [0, b1-1], [b1, b2-1], [b2, n-1]. 
         * 如果k=0, 返回空数组. 如果k=1, 返回[n]. 
         */
        function reconstructBoundaries(ptrTable, n, k) {
            if (k === 0) {
                return [];
            }
            if (n === 0 && k > 0) { // 0个数据点无法分成k>0个区间
                return [];
            }
            if (!ptrTable || ptrTable.length === 0 || !ptrTable[0] || ptrTable[0].length === 0) {
                console.error("reconstructBoundaries: ptrTable 无效. ");
                return [];
            }
            // k 是1-based的区间数. ptrTable的列索引对应区间数. 
            // ptrTable[n] 对应考虑了n个数据点的情况. 
            // ptrTable[n][k] 存储的是形成k个区间时, 最后一个区间的起始点. 
            if (k >= ptrTable[0].length || (n > 0 && k > n) || !ptrTable[n] || ptrTable[n][k] === undefined) {
                 console.warn(`无法重建边界: k=${k}, n=${n}. ptrTable 的最大 k 为 ${ptrTable[0].length -1}. 可能 k 超出范围或无解. `);
                 // 如果 k=1 且 n>0, ptrTable[n][1] 应该是 0. 
                 if (k === 1 && n > 0 && ptrTable[n] && ptrTable[n][1] !== undefined) {
                     // 只有一个区间, 它的结束点是 n
                 } else {
                    return [];
                 }
            }

            const internalSplitPoints = []; // 存储内部的分割点 (不包括0, 也不包括最后的n)
            let currentNumElements = n;    // 当前考虑的数据点数量
            let numBinsToFind = k;         // 还需找到的区间数量

            while (numBinsToFind > 0 && currentNumElements > 0) {
                if (numBinsToFind === 1) { // 如果只需要找最后一个区间
                    // 这个区间的起始点是0 (ptrTable[currentNumElements][1] 应该等于 0)
                    // 我们不需要将0加入 internalSplitPoints
                    break; 
                }
                // 获取倒数第二个区间的结束点 (即最后一个分割点)
                // ptrTable[currentNumElements][numBinsToFind] 是最后一个区间的起始点
                const lastBinStartIndex = ptrTable[currentNumElements][numBinsToFind];
                
                if (lastBinStartIndex < 0 || lastBinStartIndex >= currentNumElements) { 
                     console.error(`重建边界时发现无效指针: k=${numBinsToFind}, 当前元素数=${currentNumElements}, 指针=${lastBinStartIndex}`);
                     return []; // 错误情况, 返回空
                }
                // lastBinStartIndex 是下一个迭代中 "n" (currentNumElements)
                // 这个值本身是一个分割点 (即一个区间的结束点, 下一个区间的起始点)
                internalSplitPoints.unshift(lastBinStartIndex); // 加到最前面, 保持顺序

                currentNumElements = lastBinStartIndex; // 下一轮处理到这个点为止的数据
                numBinsToFind--;
            }
            
            // finalBoundaries 应该是 [split1, split2, ..., n]
            const finalBoundaries = [...internalSplitPoints];
            if (n > 0) { // 只有当有数据时, n才是一个有效的边界
                finalBoundaries.push(n);
            }
            
            // 验证边界数量是否等于 k
            if (finalBoundaries.length !== k && n > 0) {
                console.warn(`重建的边界数量 ${finalBoundaries.length} 与期望的 k=${k} 不符. 边界: [${finalBoundaries.join(', ')}]`);
                // 如果 k=1 且 n>0, internalSplitPoints 为空, finalBoundaries 为 [n], 长度为1. 正确.
            }
            if (n === 0 && k === 0) return []; // 0个数据0个区间, 是空边界
            if (n > 0 && k === 0) return []; // 有数据但0个区间, 也是空边界

            return finalBoundaries;
        }

        // --- Rendering Functions ---
        function renderTable(data, headers, elementId) {
            // Renders a generic table.
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            if (!data || data.length === 0) {
                container.textContent = '无数据可显示. ';
                return;
            }

            const table = document.createElement('table');
            table.className = 'min-w-full divide-y divide-gray-200';
            const thead = document.createElement('thead');
            thead.className = 'bg-gray-50';
            const headerRow = document.createElement('tr');
            
            headers.forEach(headerText => {
                const th = document.createElement('th');
                th.scope = 'col';
                th.className = 'px-3 py-2 text-center text-xs font-medium text-gray-500 uppercase tracking-wider';
                th.textContent = headerText;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            tbody.className = 'bg-white divide-y divide-gray-200';
            data.forEach((rowData, rowIndex) => {
                const tr = document.createElement('tr');
                const firstCell = document.createElement('td');
                firstCell.className = 'px-3 py-2 whitespace-nowrap text-xs text-gray-700';
                if (headers[0].toLowerCase().includes('i/j') || headers[0].toLowerCase().includes('点数') || headers[0].toLowerCase().includes('数据点')) {
                     firstCell.textContent = rowIndex;
                } else {
                     firstCell.textContent = `Bin ${rowIndex}`; 
                }
                tr.appendChild(firstCell);

                rowData.forEach((cellData) => {
                    const td = document.createElement('td');
                    td.className = 'px-3 py-2 whitespace-nowrap text-xs';
                    if (cellData === Infinity) {
                        td.textContent = '∞';
                        td.className += ' text-gray-400';
                    } else if (typeof cellData === 'number') {
                        td.textContent = cellData.toFixed(2);
                        td.className += ' text-gray-900';
                    } else {
                        td.textContent = cellData; 
                        td.className += ' text-gray-900';
                    }
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            container.appendChild(table);
        }
        
        const tooltip = d3.select(".tooltip");

        function renderHistogram(data, boundaries, elementId, title, isOptimized = false, originalData = null, errorMetric = 'sse') {
            // Renders a histogram using D3.js.
            const svgContainer = d3.select(`#${elementId}`);
            svgContainer.selectAll("*").remove(); 

            if ((!data || data.length === 0) && !isOptimized) { 
                 if (!isOptimized || (isOptimized && (!boundaries || boundaries.length === 0))) {
                    svgContainer.append("text").attr("x", "50%").attr("y", 20).attr("text-anchor", "middle").text("无数据可绘制. ");
                    return;
                 }
            }
            
            const processedData = [];
            if (isOptimized) {
                let currentIdx = 0;
                if (!originalData || originalData.length === 0) {
                     svgContainer.append("text").attr("x", "50%").attr("y", 20).attr("text-anchor", "middle").text("无原始数据进行优化. ");
                     return;
                }
                if (!boundaries || boundaries.length === 0) { 
                    if (originalData.length > 0) { 
                        // 如果有原始数据但没有边界（例如 k=0）, 则不绘制优化直方图的条形
                        // 但可能需要显示一个消息或空的坐标轴
                        // 这里我们假设如果 boundaries 为空, 则不绘制条形
                        svgContainer.append("text").attr("x", "50%").attr("y", 20).attr("text-anchor", "middle").text("无优化区间可显示. ");
                        // return; // 可以选择返回, 或者继续绘制空的坐标轴
                    } else { // originalData 也为空
                         svgContainer.append("text").attr("x", "50%").attr("y", 20).attr("text-anchor", "middle").text("无数据可绘制. ");
                        return;
                    }
                }

                if (boundaries && boundaries.length > 0) { // 仅当有边界时才处理
                    for(let i = 0; i < boundaries.length; i++) {
                        const endIdx = boundaries[i];
                        if (currentIdx >= endIdx && endIdx !== 0 && currentIdx !== 0) continue; 
                        
                        const binData = originalData.slice(currentIdx, endIdx);
                        let representativeValue = 0;

                        if (binData.length > 0) {
                            if (errorMetric === 'sae') {
                                const sortedBin = [...binData].sort((a, b) => a - b);
                                const mid = Math.floor(sortedBin.length / 2);
                                representativeValue = sortedBin.length % 2 !== 0 ? sortedBin[mid] : (sortedBin[mid - 1] + sortedBin[mid]) / 2;
                            } else { // sse
                                representativeValue = binData.reduce((s, v) => s + v, 0) / binData.length;
                            }
                        }
                        // 为该区间内的每个原始数据点创建处理后的数据条目
                        for (let j = currentIdx; j < endIdx; j++) {
                             processedData.push({ index: j, value: representativeValue, originalValue: originalData[j] });
                        }
                        currentIdx = endIdx;
                    }
                }
            } else { // not isOptimized
                data.forEach((val, idx) => processedData.push({ index: idx, value: val, originalValue: val }));
            }

            // 即使 processedData 为空 (例如 k=0 优化), 也尝试绘制坐标轴
            // if (processedData.length === 0 && originalData && originalData.length > 0) { 
            //      svgContainer.append("text").attr("x", "50%").attr("y", 20).attr("text-anchor", "middle").text("无法生成优化直方图的展示数据. ");
            //      return;
            // }
            //  if (processedData.length === 0 && (!originalData || originalData.length === 0)) {
            //      svgContainer.append("text").attr("x", "50%").attr("y", 20).attr("text-anchor", "middle").text("无数据可绘制. ");
            //      return;
            //  }


            const containerDiv = document.getElementById(elementId).parentNode;
            const margin = {top: 30, right: 30, bottom: 50, left: 50}; 
            const width = containerDiv.clientWidth - margin.left - margin.right;
            const height = parseInt(svgContainer.style('height')) - margin.top - margin.bottom;
            
            const svg = svgContainer
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
              .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);
            
            // X 轴基于原始数据的索引
            const xDomainIndices = originalData ? originalData.map((_,idx) => idx) : (data ? data.map((_,idx)=>idx) : [0]);
            const x = d3.scaleBand()
                .domain(xDomainIndices)
                .range([0, width])
                .padding(0.2);

            svg.append("g")
                .attr("transform", `translate(0,${height})`)
                .call(d3.axisBottom(x).tickFormat(d => `Bin ${d}`))
                .selectAll("text")
                .style("text-anchor", "end")
                .attr("dx", "-.8em")
                .attr("dy", ".15em")
                .attr("transform", "rotate(-45)");

            // Y 轴基于所有可能的值 (原始值和优化后的代表值)
            let yValues = [];
            if (originalData && Array.isArray(originalData)) {
                yValues.push(...originalData.filter(v => typeof v === 'number' && !isNaN(v)));
            }
            if (processedData && Array.isArray(processedData)) {
                 yValues.push(...processedData.map(d => d.value).filter(v => typeof v === 'number' && !isNaN(v)));
            }
            if (yValues.length === 0) yValues.push(0); // 确保至少有一个值用于定义域

            const yMax = d3.max(yValues);
            const yMin = d3.min(yValues);

            const y = d3.scaleLinear()
                .domain([Math.min(0, yMin), (yMax > 0 ? yMax : 10)]) 
                .range([height, 0]);

            svg.append("g")
                .call(d3.axisLeft(y));
            
            // 仅当 processedData 有内容时绘制条形图
            if (processedData.length > 0) {
                svg.selectAll(".bar")
                    .data(processedData)
                    .enter()
                    .append("rect")
                    .attr("class", "bar")
                    .attr("x", d => x(d.index))
                    .attr("y", d => y(d.value))
                    .attr("width", x.bandwidth())
                    .attr("height", d => Math.max(0, height - y(d.value))) 
                    .attr("fill", isOptimized ? (errorMetric === 'sae' ? "#FBBF24" : "#68D391") : "#6366F1") 
                    .on("mouseover", function(event, d) {
                        tooltip.transition().duration(200).style("opacity", .9);
                        tooltip.html(`索引: ${d.index}<br/>值: ${typeof d.value === 'number' ? d.value.toFixed(2) : 'N/A'}` + 
                                     (isOptimized && typeof d.originalValue === 'number' ? `<br/>原值: ${d.originalValue.toFixed(2)}` : ""))
                            .style("left", (event.pageX + 5) + "px")
                            .style("top", (event.pageY - 28) + "px");
                    })
                    .on("mouseout", function(d) {
                        tooltip.transition().duration(500).style("opacity", 0);
                    });
            }


            if (isOptimized && boundaries && boundaries.length > 0) {
                // boundaries 是 [b1, b2, ..., n]
                // 我们要在 b1, b2, ... (不包括n) 的左侧画线
                boundaries.slice(0, -1).forEach(boundaryEndIndex => { 
                    if (boundaryEndIndex === 0) return; // 不在最开始画线
                    // boundaryEndIndex 是一个区间的结束点 (exclusive)
                    // 线应该画在这个区间的右边, 即下一个区间的开始处
                    // x.domain() 是原始数据的索引 [0, 1, ..., n-1]
                    // 如果 boundaryEndIndex 是 b_i, 它代表原始数据索引 b_i
                    // 线应该在 x(b_i -1) 这个bar的右边, 或者说在 x(b_i) 这个bar的左边
                    const xPos = x(boundaryEndIndex); 
                    if (xPos !== undefined) { // 确保 boundaryEndIndex 在 x 轴的定义域内
                        svg.append("line")
                            .attr("x1", xPos - (x.paddingInner() * x.bandwidth())/2 ) // 调整到条形之间
                            .attr("y1", 0)
                            .attr("x2", xPos - (x.paddingInner() * x.bandwidth())/2 )
                            .attr("y2", height)
                            .attr("stroke", "red")
                            .attr("stroke-width", 1.5)
                            .attr("stroke-dasharray", "4");
                     }
                });
            }
        } 
        
        // --- 事件监听器 ---
        document.getElementById('visualizeBtn').addEventListener('click', () => {
            const dataStr = document.getElementById('histogramData').value;
            const maxKStr = document.getElementById('maxK').value;
            const errorMetric = document.getElementById('errorMetric').value;
            window.selectedErrorMetric = errorMetric; 

            document.getElementById('errorMessage').textContent = '';

            if (!dataStr || !maxKStr) {
                document.getElementById('errorMessage').textContent = '请输入直方图数据和最大区间数. ';
                return;
            }

            const histogramData = dataStr.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
            const maxK = parseInt(maxKStr);

            if (histogramData.length === 0 && maxK > 0) { 
                document.getElementById('errorMessage').textContent = '无效的直方图数据. 请输入有效的数字. ';
                document.getElementById('errorCacheSection').classList.add('hidden');
                document.getElementById('dpTableSection').classList.add('hidden');
                document.getElementById('ptrTableSection').classList.add('hidden');
                document.getElementById('reconstructionSection').classList.add('hidden');
                document.getElementById('originalHistogramContainer').classList.add('hidden');
                document.getElementById('optimizedHistogramContainer').classList.add('hidden');
                return;
            }
            if (isNaN(maxK) || maxK < 0) { 
                document.getElementById('errorMessage').textContent = '最大区间数 (max_k) 必须是非负整数. ';
                return;
            }
            
            window.currentHistogramData = histogramData; 

            const { dpTable, ptrTable, errorCache } = findOptimalHistogramDp(histogramData, maxK, errorMetric);
            window.currentPtrTable = ptrTable; 

            const metricName = errorMetric === 'sae' ? 'SAE (绝对值和误差)' : 'SSE (平方和误差)';
            const representativeType = errorMetric === 'sae' ? '中位数' : '均值';

            document.getElementById('errorCacheTitle').textContent = `${metricName} 缓存 (Error Cache)`;
            document.getElementById('errorCacheDescription').textContent = `error_cache[i][j] 表示 data[i...j] 区间的${metricName}. `;
            document.getElementById('dpTableTitle').textContent = `DP 表 (dp_table) - ${metricName}`;
            document.getElementById('dpTableDescription').textContent = `dp_table[i][j] 表示将前 i 个数据点分为 j 个区间的最小总${metricName}. `;
            document.getElementById('ptrTableTitle').textContent = `指针表 (ptr_table) - ${metricName}`;
            document.getElementById('ptrTableDescription').textContent = `ptr_table[i][j] 存储最后一个区间的起始索引, 用于将前 i 个数据点分为 j 个区间 (基于${metricName}). `;
            document.getElementById('optimizedHistogramTitle').textContent = `优化后的直方图 (${metricName} - ${representativeType})`;


            const n = histogramData.length;
            const errorCacheHeaders = ['i/j'];
            for(let j=0; j<n; j++) errorCacheHeaders.push(`j=${j}`);
            const displayErrorCache = Array(n).fill(null).map(() => Array(n).fill('-'));
            if (n > 0) { // 仅当有数据时才填充 errorCache
                for (let i = 0; i < n; i++) {
                    for (let j = i; j < n; j++) {
                        displayErrorCache[i][j] = errorCache[i][j];
                    }
                }
            }
            renderTable(displayErrorCache, errorCacheHeaders, 'errorCacheTableContainer');
            document.getElementById('errorCacheSection').classList.remove('hidden');
            
            const kValActual = dpTable[0] ? dpTable[0].length - 1 : 0; 
            const dpHeaders = ['i (点数)'];
            for(let j=0; j <= kValActual; j++) dpHeaders.push(`j=${j} (区间)`);
            renderTable(dpTable.map(row => row.slice()), dpHeaders, 'dpTableContainer');
            document.getElementById('dpTableSection').classList.remove('hidden');

            const ptrHeaders = ['i (点数)'];
            for(let j=0; j <= kValActual; j++) ptrHeaders.push(`j=${j} (区间)`);
            renderTable(ptrTable.map(row => row.slice()), ptrHeaders, 'ptrTableContainer');
            document.getElementById('ptrTableSection').classList.remove('hidden');

            const finalKSelect = document.getElementById('finalK');
            finalKSelect.innerHTML = '';
            
            if (n === 0) { // 如果没有数据点
                if (maxK >= 0) { // 允许 k=0
                     const option = document.createElement('option');
                     option.value = 0;
                     option.textContent = 0;
                     finalKSelect.appendChild(option);
                }
            } else if (dpTable[n]) { 
                for (let k_opt = 1; k_opt <= kValActual; k_opt++) { 
                    if (k_opt < dpTable[n].length && dpTable[n][k_opt] !== Infinity) { 
                        const option = document.createElement('option');
                        option.value = k_opt;
                        option.textContent = k_opt;
                        finalKSelect.appendChild(option);
                    }
                }
            }


            if (finalKSelect.options.length > 0) {
                 let defaultKIndex = Math.min(2, finalKSelect.options.length - 1); 
                 if (defaultKIndex < 0) defaultKIndex = 0; 
                 finalKSelect.value = finalKSelect.options[defaultKIndex].value;
                 document.getElementById('reconstructionSection').classList.remove('hidden');
            } else if (n > 0 && maxK > 0) { 
                 document.getElementById('errorMessage').textContent = `无法为任何 k > 0 找到有效的 DP 解 (使用 ${metricName}). `;
                 document.getElementById('reconstructionSection').classList.add('hidden');
            } else if (n === 0 && maxK === 0) { // n=0, maxK=0, finalK should have k=0
                 document.getElementById('reconstructionSection').classList.remove('hidden');
            }
             else { // 其他情况, 例如 n > 0 但 maxK = 0 （意味着 k=0 是唯一选项）
                 if (maxK === 0 && n > 0) { // 应该允许选择 k=0
                    const option = document.createElement('option');
                    option.value = 0;
                    option.textContent = 0;
                    finalKSelect.appendChild(option);
                    finalKSelect.value = 0;
                    document.getElementById('reconstructionSection').classList.remove('hidden');
                 } else {
                    document.getElementById('reconstructionSection').classList.add('hidden');
                 }
            }


            document.getElementById('originalHistogramContainer').classList.remove('hidden');
            document.getElementById('optimizedHistogramContainer').classList.add('hidden'); 
            
            renderHistogram(histogramData, [], 'originalHistogramChart', '原始直方图', false, histogramData, errorMetric); // Pass originalData to original hist too
            
            if (finalKSelect.options.length > 0) {
                document.getElementById('reconstructBtn').click();
            }
        }); 

        document.getElementById('reconstructBtn').addEventListener('click', () => {
            const finalKStr = document.getElementById('finalK').value;
            const n = window.currentHistogramData ? window.currentHistogramData.length : 0;
            
            if (!finalKStr && n > 0) { 
                 document.getElementById('reconstructedBoundaries').textContent = '请先运行计算并选择一个有效的最终区间数 (k). ';
                 return;
            }
             if (!finalKStr && n === 0) { // 如果没有数据, finalKStr可能是空的, 但如果k=0是唯一选项, 则应允许
                 if (document.getElementById('finalK').options.length === 1 && document.getElementById('finalK').value === "0") {
                     // Proceed with k=0 for n=0
                 } else {
                    document.getElementById('reconstructedBoundaries').textContent = '请选择最终区间数 (k). ';
                    return;
                 }
             }


            const finalK = parseInt(finalKStr);
            const errorMetric = window.selectedErrorMetric || 'sse';

            if (isNaN(finalK) || finalK < 0) {
                document.getElementById('reconstructedBoundaries').textContent = '请选择一个有效的最终区间数 (k). ';
                return;
            }
            
            if (!window.currentPtrTable && finalK > 0 && n > 0) { 
                 document.getElementById('reconstructedBoundaries').textContent = '请先运行 "计算并可视化". ';
                 return;
            }
            
            const boundaries = reconstructBoundaries(window.currentPtrTable, n, finalK);
            document.getElementById('reconstructedBoundaries').innerHTML = `
                为 k=${finalK} 重构的边界 (区间的结束点, 基于 ${errorMetric.toUpperCase()}): <strong>[${boundaries.join(', ')}]</strong> <br>
                这意味着区间 (0-indexed) 是: `;
            
            let start = 0;
            let binDefinitions = "";
            if (finalK === 0) {
                 binDefinitions = "k=0 表示无区间. ";
            } else if (n === 0 && finalK > 0) {
                 binDefinitions = "无数据无法划分区间. ";
            } else if (boundaries.length === 0 && finalK > 0 && n > 0) { 
                 binDefinitions = `无法为 k=${finalK} 重构有效区间. 可能是由于没有从DP表中找到解. `;
            }
            else {
                boundaries.forEach((end, idx) => {
                    binDefinitions += `[${start}..${end-1}]` + (idx < boundaries.length - 1 ? ", " : "");
                    start = end;
                });
            }
            document.getElementById('reconstructedBoundaries').innerHTML += `<strong>${binDefinitions}</strong>`;

            const metricName = errorMetric === 'sae' ? 'SAE (绝对值和误差)' : 'SSE (平方和误差)';
            const representativeType = errorMetric === 'sae' ? '中位数' : '均值';
            document.getElementById('optimizedHistogramTitle').textContent = `优化后的直方图 (k=${finalK}, ${metricName} - ${representativeType})`;

            document.getElementById('optimizedHistogramContainer').classList.remove('hidden');
            renderHistogram(window.currentHistogramData, boundaries, 'optimizedHistogramChart', `优化后直方图 (k=${finalK})`, true, window.currentHistogramData, errorMetric);
        }); 

    </script> 
</body>
